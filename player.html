<title>Слушай – Радио Alma Mater</title>
<!-- Alma Plus: малък плейър (отваря се от „▶ Слушай“ в covers/tools/play). Пуска потока, показва песента и обложката

<style>
  :root { --bg:#1C0D2B; --card:#2B1740; --line:#432763; --muted:#B9A7CE; --hl:#C7A4EB; --acc:#7B3FB3; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing:border-box; margin:0; padding:0; font-feature-settings:"locl" 0; }
  html, body { height:100%; }
  body { background:linear-gradient(160deg,#2B1740,#1C0D2B); color:#fff; font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; align-items:center; padding:14px 12px 14px 14px; overflow:hidden; position:relative; }
  .pl { display:flex; gap:14px; align-items:center; width:100%; }
  .art { width:110px; height:110px; border-radius:10px; flex:none; background:#3a2152 center/cover no-repeat; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .art.logo { background-size:86%; background-color:#2B1740; }
  .info { flex:1; min-width:0; }
  .now { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; letter-spacing:.08em; font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:#6f5a8a; flex:none; }
  .dot.play { background:var(--hl); animation:br 1.6s ease-in-out infinite; }
  .dot.wait { background:var(--warn); } .dot.err { background:var(--bad); }
  @keyframes br { 50% { opacity:.35; transform:scale(.8); } }
  .t { font-weight:700; font-size:15px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .a { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ctl { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .pp { width:42px; height:42px; border-radius:50%; background:#fff; color:#2B1740; border:0; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .pp:hover { background:var(--hl); }
  .pp svg { width:16px; height:16px; fill:currentColor; }
  /* Звук: къс вертикален плъзгач (84 px), % отгоре, плоска иконка отдолу (натискане = без звук) */
  .vol { width:40px; flex:none; align-self:stretch; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .pct { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; height:14px; }
  .track { position:relative; width:6px; height:84px; border-radius:3px; background:rgba(199,164,235,.2); cursor:pointer; touch-action:none; }
  .track::before { content:''; position:absolute; inset:-6px -14px; }
  .fill { position:absolute; left:0; right:0; bottom:0; border-radius:3px; background:var(--hl); }
  .knob { position:absolute; left:50%; width:14px; height:14px; margin:0 0 -7px -7px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .track:hover .knob, .track.drag .knob { transform:scale(1.15); }
  .spk { width:30px; height:30px; border:0; background:transparent; color:var(--muted); border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .spk:hover { color:#fff; background:rgba(255,255,255,.07); }
  .spk svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .vol.muted .fill { background:#6f5a8a; } .vol.muted .pct { color:var(--bad); }
  /* Браузърът не пусна звук сам – натискане където и да е */
  .tap { position:absolute; inset:0; background:rgba(20,10,31,.85); display:none; align-items:center; justify-content:center; flex-direction:column; gap:8px; cursor:pointer; text-align:center; z-index:5; padding:10px; }
  .tap.on { display:flex; }
  .tap b { font-size:15px; } .tap span { font-size:12px; color:var(--muted); max-width:320px; line-height:1.45; }
  .tap i { width:48px; height:48px; border-radius:50%; background:#fff; color:#2B1740; display:flex; align-items:center; justify-content:center; }
  .tap i svg { width:18px; height:18px; fill:currentColor; }
  .st { font-size:11px; color:var(--muted); margin-top:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>

  // Тръгва сам: отворен от „▶ Слушай“ или вече е пускан веднъж (иначе – натисни ▶).
  var auto = false; try { auto = localStorage.getItem('alma-player-auto') === '1'; } catch (e) {}
  if (/[?&]play=1/.test(location.search) || auto) start(); else ui('stop');
})();
</script>
</body>
