<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cast тест – Alma Plus</title>
<style>
  /* Същият вид като covers.html и tools.html */
  :root { --bg:#1C0D2B; --card:#2B1740; --line:#432763; --muted:#B9A7CE; --hl:#C7A4EB; --acc:#7B3FB3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:#fff; font:15px/1.45 Roboto,"Segoe UI",Arial,sans-serif; padding:20px 16px 40px; }
  .wrap { max-width:1100px; margin:0 auto; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
  h1 { font-size:22px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav a { color:var(--muted); text-decoration:none; font-size:14px; padding:6px 12px; border-radius:8px; border:1px solid var(--line); }
  nav a.on { color:#fff; background:var(--card); border-color:var(--hl); }
  .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .box h2 { font-size:15px; color:var(--hl); font-weight:600; margin-bottom:10px; }
  p { color:var(--muted); font-size:14px; line-height:1.55; margin-bottom:14px; }
  p b { color:#fff; font-weight:600; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  google-cast-launcher { display:inline-block; width:40px; height:40px; --connected-color:#10B981; --disconnected-color:#fff; cursor:pointer; }
  button { background:var(--acc); color:#fff; border:0; border-radius:9px; padding:9px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button.sec { background:transparent; border:1px solid var(--line); color:var(--muted); font-weight:500; }
  #log { margin-top:14px; background:#140920; border:1px solid var(--line); border-radius:10px; padding:12px; font:12.5px/1.5 Consolas,Menlo,monospace; color:#e9dcf7; white-space:pre-wrap; min-height:140px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Тест на Cast</h1>
    <nav><a href="covers.html">Обложки</a><a href="tools.html">Инструменти</a><a href="test.html" class="on">Тест на Cast</a><a href="index.html" target="_blank" title="Екранът, който показва устройството при Cast – телевизор, Nest Hub, Smart Clock… (отваря се в нов прозорец; звук няма – пуска се само през Cast)">Екран на Cast ↗</a></nav>
  </div>
  <div class="box">
    <h2>Alma Plus · Cast App ID 233A5E7D</h2>
    <p>Отвори тази страница в <b>Google Chrome</b> на компютър в същата Wi‑Fi мрежа като устройството (телевизор, Nest Hub…), <b>без VPN</b>.
    1) Натисни иконата за Cast и избери устройството. 2) Натисни „Пусни радиото“.</p>
    <div class="row">
      <google-cast-launcher></google-cast-launcher>
      <button id="play">Пусни радиото</button>
      <button id="stop" class="sec">Спри</button>
    </div>
    <div id="log"></div>
  </div>
</div>

<script>
  var STREAM = 'https://a1.vizitec.com:8001/almamater';
  function log(t) { var el = document.getElementById('log'); el.textContent += new Date().toLocaleTimeString() + '  ' + t + '\n'; }
  log('Зарежда Cast…');
  window['__onGCastApiAvailable'] = function (ok) {
    if (!ok) { log('Cast не е наличен – отвори страницата в Google Chrome.'); return; }
    var ctx = cast.framework.CastContext.getInstance();
    ctx.setOptions({ receiverApplicationId: '233A5E7D', autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED });
    log('Готово. Състояние: ' + ctx.getCastState());
    var HELP = 'Chrome не вижда устройство за Cast. Провери: същата Wi‑Fi мрежа; изключен VPN; устройството е включено; ' +
      'в Chrome меню ⋮ → „Предаване…“ дали се вижда. (Иконата за Cast се показва само когато има намерено устройство.)';
    if (ctx.getCastState() === 'NO_DEVICES_AVAILABLE') log(HELP);
    ctx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED, function (e) {
      log('Състояние: ' + e.castState + (e.castState === 'NOT_CONNECTED' ? ' – има устройство, избери го' : ''));
      if (e.castState === 'NO_DEVICES_AVAILABLE') log(HELP);
    });
    ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, function (e) {
      log('Сесия: ' + e.sessionState + (e.errorCode ? ' (грешка ' + e.errorCode + ')' : ''));
    });
    document.getElementById('play').onclick = function () {
      var s = ctx.getCurrentSession();
      if (!s) { log('Първо се свържи с телевизора от иконата.'); return; }
      var mi = new chrome.cast.media.MediaInfo(STREAM, 'audio/aac'); // потокът е AAC – като в приложението
      mi.streamType = chrome.cast.media.StreamType.LIVE;
      var md = new chrome.cast.media.MusicTrackMediaMetadata();
      md.title = 'Радио Alma Mater'; md.artist = '88 MHz · София';
      mi.metadata = md;
      var req = new chrome.cast.media.LoadRequest(mi); req.autoplay = true;
      var t0 = Date.now(), retried = false;
      function load() {
        s.loadMedia(req).then(function () { log('Заявката е приета, чакам звук…'); check(); }, function (err) { log('Грешка при пускане: ' + err); });
      }
      // Като в приложението: първото зареждане на Chromecast понякога не тръгва – един бърз повторен опит.
      function check() {
        var tries = 0, iv = setInterval(function () {
          var m = s.getMediaSession(), st = m && m.playerState;
          if (st === 'PLAYING') { clearInterval(iv); log('Свири ✓ (за ' + ((Date.now() - t0) / 1000).toFixed(1) + ' сек)'); return; }
          if (++tries >= 15) { clearInterval(iv); log('Не тръгна за 15 сек (състояние: ' + (st || 'няма') + ')'); return; }
          if (!retried && tries === 2 && st !== 'BUFFERING') { retried = true; log('Не тръгна – повторен опит'); load(); clearInterval(iv); }
        }, 1000);
      }
      load();
    };
    document.getElementById('stop').onclick = function () { var s = ctx.getCurrentSession(); if (s) s.endSession(true); };
  };
</script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
