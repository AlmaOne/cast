<h1>Проба на Cast – Alma Plus (233A5E7D)</h1>
<p>Отвори тази страница в <b>Google Chrome</b> на компютър в същата Wi‑Fi мрежа като телевизора.
1) Натисни иконата за Cast долу и избери телевизора. 2) Натисни „Пусни радиото“.</p>
<google-cast-launcher></google-cast-launcher>
<button id="play">Пусни радиото</button>
<button id="stop">Спри</button>
<div id="log"></div>

<script>
  var STREAM = 'https://a1.vizitec.com:8001/almamater';
  function log(t) { var el = document.getElementById('log'); el.textContent += new Date().toLocaleTimeString() + '  ' + t + '\n'; }
  log('Зарежда Cast…');
  window['__onGCastApiAvailable'] = function (ok) {
    if (!ok) { log('Cast не е наличен – отвори страницата в Google Chrome.'); return; }
    var ctx = cast.framework.CastContext.getInstance();
    ctx.setOptions({ receiverApplicationId: '233A5E7D', autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED });
    log('Готово. Състояние: ' + ctx.getCastState());
    ctx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED, function (e) { log('Състояние: ' + e.castState); });
    ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, function (e) {
      log('Сесия: ' + e.sessionState + (e.errorCode ? ' (грешка ' + e.errorCode + ')' : ''));
    });
    document.getElementById('play').onclick = function () {
      var s = ctx.getCurrentSession();
      if (!s) { log('Първо се свържи с телевизора от иконата.'); return; }
      var mi = new chrome.cast.media.MediaInfo(STREAM, 'audio/aac'); // потокът е AAC – като в приложението
      mi.streamType = chrome.cast.media.StreamType.LIVE;
      var md = new chrome.cast.media.MusicTrackMediaMetadata();
      md.title = 'Радио Alma Mater'; md.artist = '88 MHz · София';
      mi.metadata = md;
      var req = new chrome.cast.media.LoadRequest(mi); req.autoplay = true;
      var t0 = Date.now(), retried = false;
      function load() {
        s.loadMedia(req).then(function () { log('Заявката е приета, чакам звук…'); check(); }, function (err) { log('Грешка при пускане: ' + err); });
      }
      // Като в приложението: първото зареждане на Chromecast понякога не тръгва – един бърз повторен опит.
      function check() {
        var tries = 0, iv = setInterval(function () {
          var m = s.getMediaSession(), st = m && m.playerState;
          if (st === 'PLAYING') { clearInterval(iv); log('Свири ✓ (за ' + ((Date.now() - t0) / 1000).toFixed(1) + ' сек)'); return; }
          if (++tries >= 15) { clearInterval(iv); log('Не тръгна за 15 сек (състояние: ' + (st || 'няма') + ')'); return; }
          if (!retried && tries === 2 && st !== 'BUFFERING') { retried = true; log('Не тръгна – повторен опит'); load(); clearInterval(iv); }
        }, 1000);
      }
      load();
    };
    document.getElementById('stop').onclick = function () { var s = ctx.getCurrentSession(); if (s) s.endSession(true); };
  };
</script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
