  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);

  /* Размитата обложка като фон – като в приложението. */
  #bg { position:fixed; inset:-8vmin; background-size:cover; background-position:center;
    filter:blur(6vmin) saturate(1.2); opacity:0; transition:opacity 1.2s ease; }
  #bg.on { opacity:.85; }
  #shade { position:fixed; inset:0; background:linear-gradient(90deg, rgba(20,8,32,.82), rgba(20,8,32,.55)); }

  #art { flex:none; width:min(58vh,40vw); height:min(58vh,40vw); border-radius:2.4vmin; object-fit:cover;
    box-shadow:0 2vmin 6vmin rgba(0,0,0,.45); background:transparent; transition:opacity .4s ease; }
  #art.logo { box-shadow:none; }
  .info { min-width:0; flex:1; }
  .live { display:flex; align-items:center; gap:1.2vmin; font-size:2.6vmin; font-weight:700;
    letter-spacing:.5vmin; color:var(--hl); }
  .dot { width:1.6vmin; height:1.6vmin; border-radius:50%; background:#ef4444; animation:pulse 2s infinite; }
  .paused .dot { background:var(--muted); animation:none; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }
  #title { font-size:7vmin; font-weight:800; line-height:1.12; margin-top:2.4vmin;

  #artist { font-size:4.4vmin; color:var(--muted); margin-top:1.6vmin;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .station { margin-top:6vmin; font-size:2.8vmin; color:var(--muted); display:flex; align-items:center; gap:1.6vmin; }
  .station img { width:5.5vmin; height:5.5vmin; }
  #clock { position:fixed; top:4vmin; right:5vw; font-size:3.4vmin; color:var(--muted); font-variant-numeric:tabular-nums; }
  audio { display:none; }
  /* Малко невидимо видео – държи телевизора буден (без скрийнсейвър на Google). */

  #status { position:fixed; left:5vw; bottom:4vmin; font-size:2.4vmin; color:var(--muted); opacity:.85; }

    main { flex-direction:column; justify-content:center; gap:3vh; padding:0 6vw; text-align:center; }

    .live, .station { justify-content:center; }
    #title { font-size:6vh; } #artist { font-size:4vh; } .station { margin-top:2vh; }
  }
  @media (max-height: 520px) and (min-aspect-ratio: 4/3) {
    #title { font-size:9vmin; } #artist { font-size:5.6vmin; } .station { display:none; }
  }

  var $ = function (id) { return document.getElementById(id); };
  $('art').src = LOGO; $('smallLogo').src = LOGO;

  // ---- Часовник горе вдясно ----
  function tickClock() {
    var d = new Date();
    $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tickClock(); setInterval(tickClock, 10000);
  // На всеки 3 минути леко местим всичко (до ~1,5% от екрана) – окото не го забелязва.
  function drift() {
    var r = function () { return ((Math.random() * 2 - 1) * 1.5).toFixed(2); };
    $('drift').style.transform = 'translate(' + r() + 'vmin,' + r() + 'vmin)';
  }
  setInterval(drift, 180000);

  // ---- Текуща песен: същата логика като в приложението (src/nowPlaying.ts) ----
  function splitTitle(raw) {
    var t = raw.trim(), i = t.indexOf(' - ');
    return i === -1 ? { artist: '', title: t } : { artist: t.slice(0, i).trim(), title: t.slice(i + 3).trim() };
  }
  // Сървърът понякога „разваля“ кирилицата (UTF-8 байтове като латински букви) – сглобяваме я обратно.
  function fixEncoding(s) {
    if (!/[\u0080-ÿ]/.test(s) || /[^\u0000-ÿ]/.test(s)) return s;
    var out = '', i = 0;
    while (i < s.length) {
      var b = s.charCodeAt(i), n = 0, cp = 0;
      if (b < 0x80) { out += s[i++]; continue; }
      else if (b >= 0xc2 && b <= 0xdf) { n = 1; cp = b & 0x1f; }
      else if (b >= 0xe0 && b <= 0xef) { n = 2; cp = b & 0x0f; }
      else if (b >= 0xf0 && b <= 0xf4) { n = 3; cp = b & 0x07; }
      else return s;
      if (i + n >= s.length) return s;
      for (var k = 1; k <= n; k++) {
        var c = s.charCodeAt(i + k);
        if ((c & 0xc0) !== 0x80) return s;
        cp = (cp << 6) | (c & 0x3f);
      }
      out += String.fromCodePoint(cp); i += n + 1;
    }
    return out;
  }
  function decodeXml(s) {
    return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&#(\d+);/g, function (_, n) { return String.fromCharCode(Number(n)); }).replace(/&amp;/g, '&');
  }
  function fetchText(url, ms) {
    var ctrl = new AbortController(), timer = setTimeout(function () { ctrl.abort(); }, ms || 8000);
    return fetch(url, { signal: ctrl.signal }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).finally(function () { clearTimeout(timer); });
  }
  function norm(x) {
    var s = x.toLowerCase();
    try { s = s.normalize('NFKD').replace(/[̀-ͯ]/g, ''); } catch (e) {}
    return s.replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  }
  function words(x) { return norm(x).split(' ').filter(function (w) { return w.length > 1; }); }
  function overlap(q, r) {
    var qa = words(q); if (!qa.length) return 0;
    var rs = new Set(words(r));
    return qa.filter(function (w) { return rs.has(w); }).length / qa.length;
  }
  function isGoodMatch(artist, title, rArtist, rTrack) {
    var nA = norm(artist), nT = norm(title), a = norm(rArtist), t = norm(rTrack), first = nA.split(' ')[0] || '';
    var artistOk = !!first && (a.indexOf(first) !== -1 || (!!a && nA.indexOf(a.split(' ')[0]) !== -1));
    var titleOk = !!nT && !!t && (t.indexOf(nT) === 0 || nT.indexOf(t) === 0);
    var bareOk = !artist && !!nT && (a.indexOf(nT) !== -1 || nT.indexOf(a) !== -1);
    return artistOk || titleOk || bareOk || overlap(artist + ' ' + title, rArtist + ' ' + rTrack) >= 0.6;
  }
  var artCache = {};
  function findArtwork(artist, title) {
    var key = (artist + '|' + title).toLowerCase();
    if (key in artCache) return Promise.resolve(artCache[key]);
    var q = encodeURIComponent((artist + ' ' + title).trim());
    return fetchText('https://itunes.apple.com/search?term=' + q + '&media=music&entity=song&limit=10')
      .then(function (txt) {
        var res = (JSON.parse(txt).results || []).filter(function (r) {
          return isGoodMatch(artist, title, r.artistName || '', r.trackName || '');
        })[0];
        // Голяма обложка за телевизора.
        var url = res && res.artworkUrl100 ? res.artworkUrl100.replace('100x100bb', '1000x1000bb') : null;
        artCache[key] = url;
        return url;
      }).catch(function () { return null; });
  }

  // ---- Показване ----
  var lastKey = null;
  function show(song, art) {
    $('title').textContent = song ? song.title : STATION;
    $('artist').textContent = song ? (song.artist || STATION) : FREQ;
    var img = $('art');
    if (art) {
      var pre = new Image();
      pre.onload = function () {
        img.src = art; img.classList.remove('logo');
        $('bg').style.backgroundImage = 'url("' + art + '")'; $('bg').classList.add('on');
      };
      pre.src = art;
    } else {
      img.src = LOGO; img.classList.add('logo');
      $('bg').classList.remove('on');
    }
  }

  function poll() {
    fetchText(NOW_PLAYING_URL + '?_=' + Date.now()).then(function (xml) {
      var track = (xml.match(/<track>([\s\S]*?)<\/track>/) || [])[1] || '';
      var raw = fixEncoding(decodeXml((track.match(/<title>([\s\S]*?)<\/title>/) || [])[1] || '')).trim();
      var song = raw ? splitTitle(raw) : null;
      if (song && !song.title) song = null;
      var key = song ? (song.artist + '|' + song.title).toLowerCase() : '';
      if (key === lastKey) return;
      lastKey = key;
      show(song, null);
      if (song) findArtwork(song.artist, song.title).then(function (art) { if (art && key === lastKey) show(song, art); });
    }).catch(function () { /* няма връзка – опитваме пак след малко */ });
  }

  var pollTimer = null;
  function startPolling() { if (!pollTimer) { poll(); pollTimer = setInterval(poll, POLL_MS); } }
  function setPlaying(on) {
    $('main').classList.toggle('paused', !on);
    $('liveText').textContent = on ? 'НА ЖИВО' : 'СПРЯНО';
  }

  // ---- Google Cast ----
  if (window.cast && cast.framework) {
    var context = cast.framework.CastReceiverContext.getInstance();
    var pm = context.getPlayerManager();
    pm.setMediaElement($('player'));
    var E = cast.framework.events.EventType;
    var M = cast.framework.messages;
    var status = function (t) { $('status').textContent = t || ''; };
    var gotLoad = false;
    // Командата „пусни“ от телефона: винаги нашият поток и правилният вид (MP3, на живо).
    pm.setMessageInterceptor(M.MessageType.LOAD, function (req) {
      gotLoad = true;
      status('Зарежда…');
      if (req && req.media) {
        req.media.contentId = STREAM_URL;
        req.media.contentUrl = STREAM_URL;
        req.media.contentType = 'audio/mpeg';
        req.media.streamType = M.StreamType.LIVE;
      }
      if (req) { req.autoplay = true; delete req.currentTime; }
      watch();
      return req;
    });
    // Ако до 15 секунди не е тръгнало – опитваме пак (до 3 пъти).
    var tries = 0, timer = null, playingNow = false;
    function watch() {
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (playingNow || tries >= 3) return;
        tries++;
        status('Пробвам пак… (' + tries + ')');
        gotLoad = true;
        pm.load(makeReq());
        watch();
      }, 15000);
    }
    pm.addEventListener(E.PLAYING, function () { playingNow = true; tries = 0; clearTimeout(timer); setPlaying(true); status(''); });
    pm.addEventListener(E.BUFFERING, function (e) { if (e.isBuffering) status('Зарежда…'); });
    pm.addEventListener([E.PAUSE, E.ENDED, E.ABORT], function () { playingNow = false; setPlaying(false); });
    pm.addEventListener(E.REQUEST_STOP, function () { clearTimeout(timer); playingNow = false; setPlaying(false); });
    pm.addEventListener(E.ERROR, function (e) {
      setPlaying(false);
      status('Грешка при пускане' + (e && e.detailedErrorCode ? ' (код ' + e.detailedErrorCode + ')' : ''));
    });
    // Екранът не изгасва и не пуска скрийнсейвър, докато е отворен.
    var lock = null;
    function keepAwake() {
      try { var v = $('keep'); v.volume = 1; var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
      try {
        if (navigator.wakeLock && !lock) navigator.wakeLock.request('screen').then(function (l) {
          lock = l; l.addEventListener('release', function () { lock = null; });
        }).catch(function () {});
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) keepAwake(); });
    setInterval(keepAwake, 60000);
    // Пускаме радиото веднага щом екранът е готов – без да чакаме телефона.
    function selfLoad() {
      if (gotLoad) return;
      status('Пускам радиото…');
      gotLoad = true;
      pm.load(makeReq());
      watch();
    }
    function makeReq() {
      var req = new M.LoadRequestData();
      req.autoplay = true;
      req.media = new M.MediaInformation();
      req.media.contentId = STREAM_URL;
      req.media.contentUrl = STREAM_URL;
      req.media.contentType = 'audio/mpeg';
      req.media.streamType = M.StreamType.LIVE;
      var md = new M.MusicTrackMediaMetadata();
      md.title = STATION; md.artist = FREQ;
      req.media.metadata = md;
      return req;
    }
    context.addEventListener(cast.framework.system.EventType.READY, function () { selfLoad(); keepAwake(); });
    var options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = false;
    context.start(options);
  } else {
    // Отворено в обикновен браузър – показваме екрана за преглед (без звук).
    setPlaying(true);
  }
  startPolling();
})();
