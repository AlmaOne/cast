<title>Радио Alma Mater</title>
<!-- Google Cast: екранът, който телевизорът / часовникът показва, докато свири радиото. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root { --bg:#1C0D2B; --text:#fff; --muted:#B9A7CE; --hl:#C7A4EB; --accent:#7B3FB3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family: Roboto, "Google Sans", "Segoe UI", Arial, sans-serif; }
  /* Размитата обложка като фон – като в приложението. */
  #bg { position:fixed; inset:-8vmin; background-size:cover; background-position:center;
    filter:blur(6vmin) saturate(1.2); opacity:0; transition:opacity 1.2s ease; }
  #bg.on { opacity:.85; }
  /* Без обложка – размитото лого: меко лилаво сияние (като в приложението). */
  #bg.on.logo { opacity:.35; }
  #shade { position:fixed; inset:0; background:linear-gradient(90deg, rgba(20,8,32,.82), rgba(20,8,32,.55)); }
  main { position:relative; height:100%; display:flex; align-items:center; gap:6vw; padding:0 7vw; }
  #art { flex:none; width:min(58vh,40vw); height:min(58vh,40vw); border-radius:2.4vmin; object-fit:cover;
    box-shadow:0 2vmin 6vmin rgba(0,0,0,.45); background:transparent; transition:opacity .4s ease; }
  /* Логото (лилавата иконка със заоблени ъгли) – сянка по формата ѝ, без рамка. */
  #art.logo { box-shadow:none; border-radius:0; object-fit:contain; filter:drop-shadow(0 1.5vmin 3vmin rgba(0,0,0,.4)); }
  .info { min-width:0; flex:1; }
  .live { display:flex; align-items:center; gap:1.2vmin; font-size:2.6vmin; font-weight:700;
    letter-spacing:.5vmin; color:var(--hl); }
  /* Надписът е малко по-блед (по-малко запичане); точката остава ярка. */
  .live .lt { opacity:.7; }
  /* Смяна на логото (тъмно ↔ светло) – бавно преливане. */
  #art.swap { transition:opacity 1.5s ease; }
  /* Дълго предаване без песни (над 10 мин) – логото и надписите плавно на 60%. */
  #art, #title, #artist { transition:opacity 6s ease; }
  main.dim #art, main.dim #title, main.dim #artist { opacity:.6; }
  .dot { width:1.6vmin; height:1.6vmin; border-radius:50%; background:#ef4444; animation:pulse 2s infinite; }
  .paused .dot { background:var(--muted); animation:none; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }
  #title { font-size:7vmin; font-weight:800; line-height:1.12; margin-top:2.4vmin;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #artist { font-size:4.4vmin; color:var(--muted); margin-top:1.6vmin;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .station { margin-top:6vmin; font-size:2.8vmin; color:var(--muted); display:flex; align-items:center; gap:1.6vmin;
    transition:opacity .3s ease; white-space:nowrap; }
  /* Редът с „+“ и името се показва за малко при нова песен, после изчезва (против запичане). */
  .station.off { opacity:0; transition:opacity 2s ease; }
  /* Буквите „пристигат“ като на табло на гара (без плочки – само буквите). */
  #stationText { display:flex; }
  #stationText .ch { display:inline-block; min-width:.32em; text-align:center; }
  .station img { width:5.5vmin; height:5.5vmin; }

    color:#C7A4EB; opacity:.9; transition:opacity 2.5s ease; }
  @supports ((-webkit-background-clip:text) or (background-clip:text)) {
    #clock { background:linear-gradient(90deg, #B48CEA 0%, #D3A6F2 50%, #F0A6D6 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent; }
  }
  #clock.hide { opacity:0; }
  /* Винаги горе вдясно, за да се знае къде е: най-горе ↔ един ред по-надолу (точно колкото е височината му –
     така цифрите не стоят на същите точки на екрана). */
  #clock.pos0 { top:3.5vmin; right:5vw; } #clock.pos1 { top:13.5vmin; right:5vw; }
  audio { display:none; }
  /* Малко невидимо видео – държи телевизора буден (без скрийнсейвър на Google). */

  /* Бавно отместване на целия екран срещу „запичане“ на неподвижните надписи. */
  #drift { position:fixed; inset:0; transition:transform 20s ease-in-out; }
  #status { position:fixed; left:5vw; bottom:4vmin; font-size:2.4vmin; color:var(--muted); opacity:.85; }
  /* Малки екрани (Lenovo Smart Clock, Nest Hub): един под друг, по-едри букви. */
  @media (max-aspect-ratio: 4/3) {
    main { flex-direction:column; justify-content:center; gap:3vh; padding:0 6vw; text-align:center; }
    #art { width:36vh; height:36vh; }
    .info { flex:none; width:100%; }
    .live, .station { justify-content:center; }
    #title { font-size:6vh; } #artist { font-size:4vh; } .station { margin-top:2vh; }
  }
  @media (max-height: 520px) and (min-aspect-ratio: 4/3) {
    #title { font-size:9vmin; } #artist { font-size:5.6vmin; } .station { display:none; }
  }

  // Песента и обложката – чак когато звукът тръгне: заявката за песента е към същия сървър
  // като звука и го задържаше (звукът тръгваше точно 8 сек след като я прекъснехме).
  // Резервно – след 30 сек, ако по някаква причина не свири.
  if (window.cast && cast.framework) {
    cast.framework.CastReceiverContext.getInstance().getPlayerManager()
      .addEventListener(cast.framework.events.EventType.PLAYING, function () { startPolling(); });
    setTimeout(startPolling, 30000);
  } else {
    startPolling();
  }
})();
</script>
</body>
</html>
