<style>

  #shade { position:fixed; inset:0; background:linear-gradient(90deg, rgba(20,8,32,.82), rgba(20,8,32,.55)); }

  #art { flex:none; width:min(58vh,40vw); height:min(58vh,40vw); border-radius:2.4vmin; object-fit:cover;
    box-shadow:0 2vmin 6vmin rgba(0,0,0,.45); background:transparent; transition:opacity .4s ease; }
  /* Логото (лилавата иконка със заоблени ъгли) – сянка по формата ѝ, без рамка. */
  #art.logo { box-shadow:none; border-radius:0; object-fit:contain; filter:drop-shadow(0 1.5vmin 3vmin rgba(0,0,0,.4)); }
  .info { min-width:0; flex:1; }
  .live { display:flex; align-items:center; gap:1.2vmin; font-size:2.6vmin; font-weight:700;
    letter-spacing:.5vmin; color:var(--hl); }
  /* Надписът е малко по-блед (по-малко запичане); точката остава ярка. */
  .live .lt { opacity:.7; }
  .dot { width:1.6vmin; height:1.6vmin; border-radius:50%; background:#ef4444; animation:pulse 2s infinite; }
  .paused .dot { background:var(--muted); animation:none; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }
  #title { font-size:7vmin; font-weight:800; line-height:1.12; margin-top:2.4vmin;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #artist { font-size:4.4vmin; color:var(--muted); margin-top:1.6vmin;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .station { margin-top:6vmin; font-size:2.8vmin; color:var(--muted); display:flex; align-items:center; gap:1.6vmin;
    transition:opacity .3s ease; white-space:nowrap; }
  /* Редът с „+“ и името се показва за малко при нова песен, после изчезва (против запичане). */
  .station.off { opacity:0; transition:opacity 2s ease; }
  /* Буквите „пристигат“ като на табло на гара (без плочки – само буквите). */
  #stationText { display:flex; }
  #stationText .ch { display:inline-block; min-width:.32em; text-align:center; }
  .station img { width:5.5vmin; height:5.5vmin; }
  /* Часовник като таблата на старите гари. Мести се между три ъгъла (долу вляво са известията). */
  #clock { position:fixed; display:flex; gap:.12em; align-items:center; font-size:3.6vmin; opacity:.75; transition:opacity 1.2s ease; }
  #clock.hide { opacity:0; }
  #clock.pos0 { top:4vmin; right:5vw; } #clock.pos1 { bottom:4vmin; right:5vw; } #clock.pos2 { top:4vmin; left:5vw; }
  .colon { width:.3em; display:flex; flex-direction:column; gap:.28em; align-items:center; }
  .colon i { width:.13em; height:.13em; border-radius:50%; background:#E2C6FF; }
  .fd { position:relative; width:.95em; height:1.35em; perspective:3em; font-weight:700; color:#E2C6FF; font-variant-numeric:tabular-nums; }
  .fd .h { position:absolute; left:0; width:100%; height:50%; overflow:hidden; text-align:center; }
  .fd .h span { display:block; height:1.35em; line-height:1.35em; }
  .fd .t { top:0; border-radius:.12em .12em 0 0; background:#2A1A3C; }
  .fd .b { bottom:0; border-radius:0 0 .12em .12em; background:#22142F; }
  .fd .b span { transform:translateY(-50%); }
  .fd::after { content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.55); z-index:5; }
  .fd .fa { z-index:3; transform-origin:50% 100%; backface-visibility:hidden; }
  .fd .fb { z-index:3; transform-origin:50% 0; transform:rotateX(90deg); backface-visibility:hidden; }
  .fd.go .fa { animation:flipA .22s ease-in forwards; }
  .fd.go .fb { animation:flipB .22s ease-out .22s forwards; }
  @keyframes flipA { to { transform:rotateX(-90deg); } }
  @keyframes flipB { to { transform:rotateX(0); } }
  audio { display:none; }
  /* Малко невидимо видео – държи телевизора буден (без скрийнсейвър на Google). */
  #keep { position:fixed; left:0; bottom:0; width:2px; height:2px; opacity:.01; pointer-events:none; }
  /* Бавно отместване на целия екран срещу „запичане“ на неподвижните надписи. */
  #drift { position:fixed; inset:0; transition:transform 20s ease-in-out; }
  #status { position:fixed; left:5vw; bottom:4vmin; font-size:2.4vmin; color:var(--muted); opacity:.85; }
  /* Малки екрани (Lenovo Smart Clock, Nest Hub): един под друг, по-едри букви. */
  @media (max-aspect-ratio: 4/3) {
    main { flex-direction:column; justify-content:center; gap:3vh; padding:0 6vw; text-align:center; }
    #art { width:36vh; height:36vh; }
    .info { flex:none; width:100%; }
    .live, .station { justify-content:center; }
    #title { font-size:6vh; } #artist { font-size:4vh; } .station { margin-top:2vh; }
  }
  @media (max-height: 520px) and (min-aspect-ratio: 4/3) {
    #title { font-size:9vmin; } #artist { font-size:5.6vmin; } .station { display:none; }
  }
</style>

    'м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch',
    'ш':'sh','щ':'sht','ъ':'a','ь':'y','ю':'yu','я':'ya','ё':'yo','ы':'y','э':'e' };
  function translit(x) { return x.toLowerCase().replace(/[а-яё]/g, function (c) { return TRANSLIT[c] || c; }); }
  function hasCyrillic(x) { return /[а-яё]/i.test(x); }
  // Без ударения, кирилицата на латиница, „ts“→„c“ и „y“→„i“ („Елица“ = Elitsa, „Щурците“ = Shturcite).
  function norm(x) {
    var s = x.toLowerCase();
    try { s = s.normalize('NFKD').replace(/[̀-ͯ]/g, ''); } catch (e) {}
    return translit(s).replace(/ts/g, 'c').replace(/y/g, 'i').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  }
  function words(x) { return norm(x).split(' ').filter(function (w) { return w.length > 1; }); }
  function overlap(q, r) {
    var qa = words(q); if (!qa.length) return 0;
    var rs = new Set(words(r));
    return qa.filter(function (w) { return rs.has(w); }).length / qa.length;
  }
  // Отделните имена в „А & Б“, „А, Б“, „А feat. Б“, „А и Б“.
  function people(x) {
    return x.split(/\s*[,&\/]\s*|\s+(?:feat\.?|ft\.?|featuring|and|x|и)\s+/i).map(norm).filter(Boolean);
  }
  // 2 – същата песен (или изпълнителят, ако имаме само име), 1 – същият изпълнител, друга песен, 0 – не.
  function matchScore(artist, title, rArtist, rTrack) {
    var nT = norm(title), a = norm(rArtist);
    if (!artist) return (!!nT && !!a && (a.indexOf(nT) !== -1 || nT.indexOf(a) !== -1)) ? 2 : 0;
    // Изпълнителят съвпада само като цяло име („Мариус“ ≠ „Marius de Vries“, но „KOOL“ = „Kool & The Gang“).
    var nA = norm(artist), ours = people(artist), theirs = people(rArtist);
    var artistOk = ours.some(function (o) { return o === a || theirs.indexOf(o) !== -1; }) ||
      theirs.some(function (t) { return t === nA; });
    if (!artistOk) return 0;
    var t = norm(rTrack);
    var titleOk = !!nT && !!t && (t.indexOf(nT) === 0 || nT.indexOf(t) === 0 || overlap(title, rTrack) >= 0.6);
    return titleOk ? 2 : 1;
  }
  var artCache = {};
  // Опити: американският магазин → българският → на латиница → само заглавието → само изпълнителя.
  // Спира при същата песен; ако такава няма – обложка от същия изпълнител.
  function findArtwork(artist, title) {
    var key = (artist + '|' + title).toLowerCase();
    if (key in artCache) return Promise.resolve(artCache[key]);
    var full = (artist + ' ' + title).trim();
    var tries = [[full, 'us'], [full, 'bg']];
    if (hasCyrillic(full)) tries.push([translit(full), 'bg']);
    if (artist && title) { tries.push([title, 'bg']); tries.push([artist, 'bg']); }
    var fallback = null;
    function attempt(i) {
      if (i >= tries.length) return Promise.resolve(fallback);
      var url = 'https://itunes.apple.com/search?term=' + encodeURIComponent(tries[i][0]) +
        '&media=music&entity=song&limit=10&country=' + tries[i][1];
      return fetchText(url).then(function (txt) {
        var best = null, bestScore = 0;
        (JSON.parse(txt).results || []).forEach(function (r) {
          var sc = matchScore(artist, title, r.artistName || '', r.trackName || '');
          if (!sc || !r.artworkUrl100) return;
          // При равенство – албумът с най-малък номер: телефонът и телевизорът избират една и съща обложка.
          var id = Number(r.collectionId) || Infinity, bestId = best ? (Number(best.collectionId) || Infinity) : Infinity;
          if (sc > bestScore || (sc === bestScore && id < bestId)) { best = r; bestScore = sc; }
        });
        // Голяма обложка за телевизора.
        var big = best ? best.artworkUrl100.replace('100x100bb', '1000x1000bb') : null;
        if (bestScore === 2) return big;
        if (big && !fallback) fallback = big;
        return attempt(i + 1);
      });
    }
    return attempt(0).then(function (url) {
      artCache[key] = url;
      return url;
    }).catch(function () { return null; });
  }

  // ---- Показване ----
  var lastKey = null;
  // pending: обложката още се търси – фонът остава стария (без мигане между песните).
  function show(song, art, pending) {
    $('title').textContent = song ? song.title : STATION;
    $('artist').textContent = song ? (song.artist || STATION) : FREQ;
    var img = $('art');
    if (art) {
      var pre = new Image();
      pre.onload = function () {
        img.src = art; img.classList.remove('logo');
        $('bg').style.backgroundImage = 'url("' + art + '")'; $('bg').classList.remove('logo'); $('bg').classList.add('on');
      };
      pre.src = art;
    } else {
      img.src = LOGO; img.classList.add('logo');
      if (pending) return;
      $('bg').style.backgroundImage = 'url("' + LOGO + '")'; $('bg').classList.add('on', 'logo');
    }
  }

  function poll() {
    fetchText(NOW_PLAYING_URL + '?_=' + Date.now()).then(function (xml) {
      var track = (xml.match(/<track>([\s\S]*?)<\/track>/) || [])[1] || '';
      var raw = fixEncoding(decodeXml((track.match(/<title>([\s\S]*?)<\/title>/) || [])[1] || '')).trim();
      var song = raw ? splitTitle(raw) : null;
      if (song && !song.title) song = null;
      var key = song ? (song.artist + '|' + song.title).toLowerCase() : '';
      if (key === lastKey) return;
      lastKey = key;
      flashStation(!!song);
      show(song, null, !!song);
      if (song) findArtwork(song.artist, song.title).then(function (art) {
        if (key !== lastKey) return;
        show(song, art, false); // с обложка – или размитото лого, ако няма
      });
    }).catch(function () { /* няма връзка – опитваме пак след малко */ });
  }

  var pollTimer = null;
  function startPolling() { if (!pollTimer) { poll(); pollTimer = setInterval(poll, POLL_MS); } }
  function setPlaying(on) {
    $('main').classList.toggle('paused', !on);
    $('liveText').textContent = on ? 'НА ЖИВО' : 'СПРЯНО';
  }

  // ---- Google Cast ----
  if (window.cast && cast.framework) {
    var context = cast.framework.CastReceiverContext.getInstance();
    var pm = context.getPlayerManager();
    pm.setMediaElement($('player'));
    var E = cast.framework.events.EventType;
    var M = cast.framework.messages;
    var status = function (t) { if (window.__diagOn) return; $('status').textContent = t || ''; }; // докато тече диагностиката – не я затриваме
    var gotLoad = false;
    var loadStartedAt = 0; // кога телевизорът сам е започнал да зарежда радиото
    // Командата „пусни“ от телефона: винаги нашият поток и правилният вид (MP3, на живо).
    pm.setMessageInterceptor(M.MessageType.LOAD, function (req) {
      // Телевизорът вече зарежда / свири радиото – повторно „пусни“ от телефона би започнало
      // зареждането отначало (и би забавило звука). Пренебрегваме го.
      var fromPhone = req && req.senderId && req.senderId !== 'local';
      if (fromPhone && typeof diag === 'function') diag((playingNow || Date.now() - loadStartedAt < 20000) ? 'тел. (пропуснат)' : 'тел. пуска');
      if (fromPhone && (playingNow || Date.now() - loadStartedAt < 20000)) return null;
      gotLoad = true;
      status('Зарежда…');
      if (req && req.media) {
        req.media.contentId = STREAM_URL;
        req.media.contentUrl = STREAM_URL;
        req.media.contentType = 'audio/aac'; // потокът е AAC 160 kbps (с „audio/mpeg“ Chromecast тръгваше след ~27 сек)
        req.media.streamType = M.StreamType.LIVE;
      }
      if (req) { req.autoplay = true; delete req.currentTime; }
      watch();
      return req;
    });
    // Ако не тръгне – опитваме пак (до 3 пъти), но без да прекъсваме зареждане, което върви.
    var tries = 0, timer = null, playingNow = false;
    // Ако зареждането върви (трупа звук), НЕ го започваме отначало – така губехме по 15 сек.
    // Пробваме пак само при грешка или ако 40 сек нищо не е тръгнало.
    var buffering = false;
    function watch() {
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (playingNow || tries >= 3) return;
        if (buffering) { watch(); return; }
        tries++;
        status('Пробвам пак… (' + tries + ')');
        gotLoad = true;
        loadStartedAt = Date.now();
        pm.load(makeReq());
        watch();
      }, 40000);
    }
    pm.addEventListener(E.PLAYING, function () { playingNow = true; tries = 0; clearTimeout(timer); setPlaying(true); status(''); keepAwake(); });
    var stallTimer = null, everPlayed = false;
    pm.addEventListener(E.BUFFERING, function (e) {
      buffering = !!e.isBuffering;
      clearTimeout(stallTimer);
      if (e.isBuffering) {
        status('Зарежда…');
        // Първото пускане на Chromecast никога не тръгва само (видяно с диагностиката), а второто – винаги.
        // Затова: щом първото започне да трупа – след 1 сек пускаме наново. При следващите – чакаме до 20 сек.
        stallTimer = setTimeout(function () {
          if (playingNow || tries >= 3) return;
          tries++;
          if (typeof diag === 'function') diag('нов опит ' + tries);
          gotLoad = true; loadStartedAt = Date.now();
          pm.load(makeReq());
        }, (tries === 0 && !everPlayed) ? 1000 : 20000); // по време на слушане (временна засечка в мрежата) – търпеливо
      }
    });
    pm.addEventListener(E.PLAYING, function () { clearTimeout(stallTimer); everPlayed = true; });
    pm.addEventListener([E.PAUSE, E.ENDED, E.ABORT], function () { playingNow = false; setPlaying(false); releaseAwake(); });
    pm.addEventListener(E.REQUEST_STOP, function () { clearTimeout(timer); playingNow = false; setPlaying(false); releaseAwake(); });
    pm.addEventListener(E.ERROR, function (e) {
      setPlaying(false);
      buffering = false;
      // при грешка – нов опит след 3 сек, без да чакаме
      if (!playingNow && tries < 3) { clearTimeout(timer); timer = setTimeout(function () { tries++; gotLoad = true; loadStartedAt = Date.now(); pm.load(makeReq()); watch(); }, 3000); }
      status('Грешка при пускане' + (e && e.detailedErrorCode ? ' (код ' + e.detailedErrorCode + ')' : ''));
    });
    // Екранът не изгасва и не пуска скрийнсейвър, докато е отворен.
    var lock = null;
    function keepAwake() {
      try { var v = $('keep'); v.volume = 1; var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
      try {
        if (navigator.wakeLock && !lock) navigator.wakeLock.request('screen').then(function (l) {
          lock = l; l.addEventListener('release', function () { lock = null; });
        }).catch(function () {});
      } catch (e) {}
    }
    // Спряно радио – пускаме телевизора да си пусне скрийнсейвъра / да заспи.
    function releaseAwake() {
      try { $('keep').pause(); } catch (e) {}
      try { if (lock) { lock.release(); lock = null; } } catch (e) {}
    }
    // Будни сме САМО докато реално свири музика.
    document.addEventListener('visibilitychange', function () { if (!document.hidden && playingNow) keepAwake(); });
    setInterval(function () { if (playingNow) keepAwake(); }, 60000);
    // Пускаме радиото веднага щом екранът е готов – без да чакаме телефона.
    function selfLoad() {
      if (gotLoad) return;
      status('Пускам радиото…');
      gotLoad = true;
      loadStartedAt = Date.now();
      if (typeof diag === 'function') diag('сам пуска');
      pm.load(makeReq());
      watch();
    }
    function makeReq() {
      var req = new M.LoadRequestData();
      req.autoplay = true;
      req.media = new M.MediaInformation();
      req.media.contentId = STREAM_URL;
      req.media.contentUrl = STREAM_URL;
      req.media.contentType = 'audio/aac'; // потокът е AAC 160 kbps (с „audio/mpeg“ Chromecast тръгваше след ~27 сек)
      req.media.streamType = M.StreamType.LIVE;
      var md = new M.MusicTrackMediaMetadata();
      md.title = STATION; md.artist = FREQ;
      req.media.metadata = md;
      return req;
    }
    context.addEventListener(cast.framework.system.EventType.READY, function () { selfLoad(); });
    // ---- ВРЕМЕННА ДИАГНОСТИКА: след колко секунди става всяка стъпка (първата минута, долу вляво) ----
    var diagT0 = performance.now(), diagLog = [], diagOn = true; window.__diagOn = true;
    function diag(name) {
      if (!diagOn) return;
      var t = ((performance.now() - diagT0) / 1000).toFixed(1);
      if (diagLog.length && diagLog[diagLog.length - 1].slice(-name.length) === name) return;
      diagLog.push(t + ' ' + name);
      $('status').textContent = '⏱ ' + diagLog.slice(-9).join(' · ');
    }
    setTimeout(function () { diagOn = false; window.__diagOn = false; $('status').textContent = ''; }, 90000);
    diag('v11');
    context.addEventListener(cast.framework.system.EventType.READY, function () { diag('готов'); });
    try { (function () {
      var a = $('player');
      [['loadstart', 'връзка'], ['loadedmetadata', 'формат'], ['progress', 'данни'], ['waiting', 'чака'],
       ['stalled', 'засечка'], ['canplay', 'готово'], ['playing', 'свири'], ['error', 'грешка']].forEach(function (p) {
        a.addEventListener(p[0], function () { diag(p[1]); });
      });
      pm.addEventListener(E.BUFFERING, function (e) { diag(e.isBuffering ? 'буфер+' : 'буфер−'); });
      pm.addEventListener(E.PLAYER_LOAD_COMPLETE, function () { diag('зареден'); });
    })(); } catch (e) {} // диагностиката никога не бива да пречи на звука
    // Таймер за заспиване от телефона: последните 30 секунди звукът затихва, после радиото спира.
    // Работи тук, на телевизора – дори телефонът да е заключен.
    var NS = 'urn:x-cast:bg.radioalmamater.app';
    var SLEEP_FADE_MS = 30000;
    var sleepUntil = null, sleepTick = null;
    // Затихване. Звукът на самия плейър Chromecast често не го слуша, затова намаляваме
    // и звука на устройството – и после го връщаме точно както е бил.
    var origVol = null;
    function fadeTo(k) {
      try { $('player').volume = k; } catch (e) {}
      try {
        if (origVol == null) {
          var v = context.getSystemVolume();
          origVol = v && typeof v.level === 'number' ? v.level : null;
        }
        if (origVol != null) context.setSystemVolumeLevel(Math.max(0.01, origVol * k));
      } catch (e) {}
    }
    function restoreVol() {
      try { $('player').volume = 1; } catch (e) {}
      if (origVol != null) {
        try { context.setSystemVolumeLevel(origVol); } catch (e) {}
        origVol = null;
      }
    }
    function clearSleep(keepVolume) {
      clearInterval(sleepTick); sleepTick = null; sleepUntil = null;
      if (!keepVolume) restoreVol();
    }
    function checkSleep() {
      if (!sleepUntil) return;
      var left = sleepUntil - Date.now();
      if (left <= 0) {
        clearSleep(true); // звукът остава тих, докато радиото спре
        clearTimeout(timer); tries = 3; // да не се пуска пак само
        try { pm.stop(); } catch (e) {}
        // Връщаме звука на устройството чак след като радиото е спряло (без „гръмване“).
        setTimeout(restoreVol, 1500);
        setPlaying(false);
        releaseAwake();
        status('Таймерът за заспиване спря радиото');
        // След 5 секунди затваряме нашия екран – Google TV се връща в обичайния си режим
        // и сам пуска скрийнсейвъра / заспива. Телефонът също разбира, че връзката е приключила.
        setTimeout(function () { restoreVol(); try { context.stop(); } catch (e) {} }, 5000);
        return;
      }
      if (left < SLEEP_FADE_MS) {
        fadeTo(Math.max(0.05, left / SLEEP_FADE_MS));
        // Последните 30 секунди – отброяване долу вляво.
        status('Таймер за заспиване: радиото спира след ' + Math.ceil(left / 1000) + ' сек');
      }
    }
    // Екранът се затваря (напр. телефонът прекъсна връзката) – звукът на устройството да не остане тих.
    context.addEventListener(cast.framework.system.EventType.SHUTDOWN, function () { restoreVol(); });
    context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, function () { if (!sleepUntil) restoreVol(); });
    context.addCustomMessageListener(NS, function (e) {
      var d = e && e.data;
      if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { d = null; } }
      if (!d || d.type !== 'sleep') return;
      // „Изключи“ точно в края на таймера (часовниците на телефона и телевизора се разминават) – пренебрегваме:
      // таймерът и без това свършва, нека затихването и спирането да се довършат.
      if (typeof d.leftMs !== 'number' && sleepUntil && sleepUntil - Date.now() < 3000) return;
      if (sleepUntil && sleepUntil - Date.now() < SLEEP_FADE_MS) status(''); // таймерът е спрян/сменен по време на отброяването
      clearSleep();
      if (typeof d.leftMs === 'number') {
        sleepUntil = Date.now() + Math.max(0, d.leftMs);
        sleepTick = setInterval(checkSleep, 1000);
        checkSleep();
      }
    });
    // Нов старт от телефона след таймера – пълен звук и нормален надпис.
    pm.addEventListener(E.PLAYING, function () { tries = 0; if (!sleepUntil) { try { $('player').volume = 1; } catch (e) {} } });

    var options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = false;
    // Тръгваме, щом има 1 сек натрупан звук (по подразбиране Chromecast чака ~8 сек при поток на живо).
    try {
      var pc = new cast.framework.PlaybackConfig();
      pc.autoResumeDuration = 1;
      pc.autoResumeNumberOfSegments = 1;
      options.playbackConfig = pc;
    } catch (e) {}
    options.customNamespaces = {};
    options.customNamespaces[NS] = cast.framework.system.MessageType.JSON;
    context.start(options);
  } else {
    // Отворено в обикновен браузър – показваме екрана за преглед (без звук).
    setPlaying(true);
  }
  show(null, null, false); // начален фон – размитото лого
  // Песента и обложката – чак когато звукът тръгне: заявката за песента е към същия сървър
  // като звука и го задържаше (звукът тръгваше точно 8 сек след като я прекъснехме).
  // Резервно – след 30 сек, ако по някаква причина не свири.
  if (window.cast && cast.framework) {
    cast.framework.CastReceiverContext.getInstance().getPlayerManager()
      .addEventListener(cast.framework.events.EventType.PLAYING, function () { startPolling(); });
    setTimeout(startPolling, 30000);
  } else {
    startPolling();
  }
})();
</script>
