  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family: Manrope, Roboto, "Google Sans", "Segoe UI", Arial, sans-serif; }
  /* Обикновена кирилица навсякъде: шрифтовете на Google при lang="bg" пишат „Радио“ като „Paguo“. */
  html, body, * { font-feature-settings:"locl" 0; }
  /* Размитата обложка като фон – като в приложението. */
  #bg { position:fixed; inset:-8vmin; background-size:cover; background-position:center;
    filter:blur(6vmin) saturate(1.2); opacity:0; transition:opacity 1.2s ease; }
  #bg.on { opacity:.85; }
  /* Без обложка – размитото лого: меко лилаво сияние (като в приложението). */
  #bg.on.logo { opacity:.35; }
  #shade { position:fixed; inset:0; background:linear-gradient(90deg, rgba(26,15,46,.80), rgba(26,15,46,.55)); }
  main { position:relative; height:100%; display:flex; align-items:center; gap:6vw; padding:0 7vw; }
  #art { flex:none; width:min(58vh,40vw); height:min(58vh,40vw); border-radius:2.4vmin; object-fit:cover;
    box-shadow:0 2vmin 6vmin rgba(0,0,0,.45); background:transparent; transition:opacity .4s ease; }
  /* Логото (лилавата иконка със заоблени ъгли) – сянка по формата ѝ, без рамка. */
  #art.logo { box-shadow:none; border-radius:0; object-fit:contain; filter:drop-shadow(0 1.5vmin 3vmin rgba(0,0,0,.4)); }
  .info { min-width:0; flex:1; }
  .live { display:flex; align-items:center; gap:1.2vmin; font-size:2.6vmin; font-weight:800;
    letter-spacing:.5vmin; color:var(--text); }
  /* v32: петте цветни чертички от сайта и приложението (над „СЕГА“). Плуват заедно с всичко – не запичат. */
  .dashes { display:flex; gap:1vmin; margin-bottom:2.2vmin; }
  .dashes i { display:block; width:4.4vmin; height:.75vmin; border-radius:.4vmin; }
  .dashes i:nth-child(1), .bars i:nth-child(1) { background:#FF8A1F; }
  .dashes i:nth-child(2), .bars i:nth-child(2) { background:#19C2A8; }
  .dashes i:nth-child(3), .bars i:nth-child(3) { background:#F0479A; }
  .dashes i:nth-child(4), .bars i:nth-child(4) { background:#F7B500; }
  .dashes i:nth-child(5) { background:#4C8DFF; }
  /* v32: стълбчетата вместо точката – подскачат, докато свири; сиви и неподвижни при спряно. */
  .bars { display:inline-flex; align-items:flex-end; gap:.5vmin; height:2.9vmin; }
  .bars i { display:block; width:.75vmin; border-radius:.3vmin; transform-origin:bottom; animation:eq .9s ease-in-out infinite; }
  .bars i:nth-child(1) { height:60%; animation-duration:.6s; }
  .bars i:nth-child(2) { height:100%; animation-duration:.77s; }
  .bars i:nth-child(3) { height:45%; animation-duration:.94s; }
  .bars i:nth-child(4) { height:80%; animation-duration:1.11s; }
  .paused .bars i { background:#5D4A72; animation:none; }
  @keyframes eq { 0%,100% { transform:scaleY(.35) } 50% { transform:scaleY(1) } }
  /* Надписът е малко по-блед (по-малко запичане); точката остава ярка. */
  .live .lt { opacity:.85; }
  .paused .live .lt { color:#A99BC0; }
  /* Смяна на логото (тъмно ↔ светло) – бавно преливане. */
  #art.swap { transition:opacity 1.5s ease; }
  /* Дълго предаване без песни (над 10 мин) – логото и надписите плавно на 60%. */
  #art, #title, #artist { transition:opacity 6s ease; }
  main.dim #art, main.dim #title, main.dim #artist, main.dim .dashes { opacity:.6; }
  .dashes { transition:opacity 6s ease; }
  .dot { width:1.6vmin; height:1.6vmin; border-radius:50%; background:#ef4444; animation:pulse 2s infinite; }
  .paused .dot { background:var(--muted); animation:none; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }
  #title { font-size:7vmin; font-weight:800; line-height:1.12; margin-top:2.4vmin; letter-spacing:-.01em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  #clock { position:fixed; font-family:ThinDigits, 'Helvetica Neue', Roboto, sans-serif; font-weight:100; font-size:9vmin;
    line-height:1; letter-spacing:-.02em; word-spacing:.18em; white-space:nowrap; font-variant-numeric:tabular-nums;
    color:#C7A4EB; opacity:.9; transition:opacity 2.5s ease; }
  @supports ((-webkit-background-clip:text) or (background-clip:text)) {
    #clock { background:linear-gradient(90deg, #B48CEA 0%, #D3A6F2 50%, #F0A6D6 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent; }
  }
  #clock.hide { opacity:0; }
  /* Винаги горе вдясно, за да се знае къде е: най-горе ↔ един ред по-надолу (точно колкото е височината му –
     така цифрите не стоят на същите точки на екрана). */
  #clock.pos0 { top:3.5vmin; right:5vw; } #clock.pos1 { top:13.5vmin; right:5vw; }
  audio { display:none; }
  /* Малко невидимо видео – държи телевизора буден (без скрийнсейвър на Google). */
  #keep { position:fixed; left:0; bottom:0; width:2px; height:2px; opacity:.01; pointer-events:none; }
  /* v32: срещу „запичане“ – обложката и надписите обикалят бавно в кръг (елипса) докъдето позволява екранът.
     Хоризонталът и вертикалът са едно и също темпо, изместени с четвърт обиколка – получава се кръг.
     Колко далеч – мери се за всеки екран (--rx, --ry, виж fitFloat()); никога не излиза извън екрана.
     Една обиколка – 4 мин (≈3 точки в секунда). Само местене (transform) – леко за Chromecast. */
  #drift { position:fixed; inset:0; }
  #float { position:absolute; inset:0; animation:circX 120s ease-in-out infinite alternate; }
  #main { animation:circY 120s ease-in-out -60s infinite alternate; }
  @keyframes circX { 0% { transform:translateX(calc(-1 * var(--rx, 5vw))) } 100% { transform:translateX(var(--rx, 5vw)) } }
  @keyframes circY { 0% { transform:translateY(calc(-1 * var(--ry, 8vh))) } 100% { transform:translateY(var(--ry, 8vh)) } }
  @media (prefers-reduced-motion: reduce) { #float, #main { animation:none; } }
  #status { position:fixed; left:5vw; bottom:4vmin; font-size:2.4vmin; color:var(--muted); opacity:.85; }
  /* Малки екрани (Lenovo Smart Clock, Nest Hub): един под друг, по-едри букви. */
  @media (max-aspect-ratio: 4/3) {
    main { flex-direction:column; justify-content:center; gap:3vh; padding:0 6vw; text-align:center; }
    #art { width:36vh; height:36vh; }
    .info { flex:none; width:100%; }
    .live, .station, .dashes { justify-content:center; }
    #title { font-size:6vh; } #artist { font-size:4vh; } .station { margin-top:2vh; }
  }
  @media (max-height: 520px) and (min-aspect-ratio: 4/3) {
    #title { font-size:9vmin; } #artist { font-size:5.6vmin; } .station { display:none; }
  }
  /* v34 (31.10.2026) */
  /* Смяна на страната (против запичане): обложката ту вляво, ту вдясно; надписите – откъм обложката. */
  main.flip { flex-direction:row-reverse; }
  main.flip .info { text-align:right; }
  main.flip .live, main.flip .station, main.flip .dashes { justify-content:flex-end; }
  @media (max-aspect-ratio: 4/3) {
    main.flip { flex-direction:column-reverse; }
    main.flip .info { text-align:center; }
    main.flip .live, main.flip .station, main.flip .dashes { justify-content:center; }
  }
  /* v35 (31.10.2026) */
  /* Стена от обложки (alma-wall.js): зад песента, над размития фон и под тъмния слой. */
  #almaWall { position:fixed; left:0; top:0; pointer-events:none; transition:transform 60s ease-in-out; will-change:transform; }
  #almaWall .t { position:absolute; overflow:hidden; border-radius:.7vmin; background:#2A1650; opacity:0;
    transition:opacity 2.5s ease, transform .38s ease-in; }
  #almaWall .t.on { opacity:.8; }
  #almaWall .t.on.new { opacity:1; box-shadow:0 0 0 .3vmin rgba(255,255,255,.35); }
  #almaWall .t.flip { transform:scaleX(0); transition:opacity 2.5s ease, transform .38s ease-out; }
  #almaWall .t img { display:block; width:100%; height:100%; object-fit:cover; }
  /* v36 (31.10.2026) */
  /* AlmaRoam (alma-roam.js): когато няма песен, голямото лого не се показва – надписите, малки, се разхождат
     по целия екран, а във фона плува меко сияние в цветовете на чертичките (против запичане). */
  @property --gc { syntax:'<color>'; inherits:false; initial-value:#4C8DFF; }
  html.roam #float, html.roam #main { animation:none !important; }
  html.roam main { position:absolute; left:0; top:0; height:auto; width:max-content; max-width:80vw; padding:0; gap:3vmin;
    transition:transform 25s ease-in-out; will-change:transform; }
  html.roam #art { display:none !important; }
  html.roam main:not(.placed) { visibility:hidden; } /* докато не е избрано първото място – да не мигне горе вляво */
  html.roam #bg { opacity:0 !important; }
  /* Сиянието: радиален преход (без filter:blur – по-леко за Chromecast); цветът се сменя плавно (--gc). */
  #almaGlow { position:fixed; left:0; top:0; width:80vmax; height:80vmax; pointer-events:none; opacity:0; will-change:transform;
    background:radial-gradient(circle closest-side, var(--gc) 0%, transparent 100%);
    transition:opacity 3s ease, --gc 12s ease, transform 30s ease-in-out; }
  html.roam #almaGlow { opacity:.38; }
  html.roam .info { flex:none; max-width:46vw; }
  html.roam #title { font-size:5vmin; margin-top:1.2vmin; }
  html.roam #artist { font-size:3.2vmin; margin-top:.8vmin; }
  html.roam .live { font-size:1.9vmin; }
  html.roam .dashes { margin-bottom:1.3vmin; } html.roam .dashes i { width:3vmin; height:.5vmin; }
  html.roam .station { margin-top:2.6vmin; font-size:1.9vmin; } html.roam .station img { width:3.6vmin; height:3.6vmin; }
</style>

<script>
/* AlmaFade – плавна смяна: старото бавно избледнява в новото (Радио Alma Mater).
   Без зависимости; става за всяка страница (скрийнсейвър, телевизор, сайт, плейър).

   AlmaFade.swap(el, change, ms)
     el     – елементът, който се сменя (картинка, фон с background-image, кутия с текст…)
     change – функция, която прави смяната (напр. img.src = нова)
     ms     – колко трае избледняването (по подразбиране 1500)
   Как: прави неподвижно копие на el точно отгоре, изпълнява change() отдолу и копието избледнява.
   Новата картинка трябва вече да е заредена (new Image() + onload), иначе отдолу ще е празно.
   При „намалено движение“ в системата смяната е мигновена. */
(function (w) {
  'use strict';
  var SKIP = /^(animation|transition|will-change)/;
  function reduced() {
    try { return w.matchMedia && w.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  }

    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    var cs = w.getComputedStyle(el), g = el.cloneNode(true);
    g.removeAttribute('id'); g.removeAttribute('class');
    // копираме как изглежда (цветове, сенки, размазване…) – без анимациите
    for (var i = 0; i < cs.length; i++) {
      var p = cs[i];
      if (!SKIP.test(p)) g.style.setProperty(p, cs.getPropertyValue(p));
    }
    var s = g.style;
    s.position = 'fixed'; s.right = 'auto'; s.bottom = 'auto';
    s.left = r.left + 'px'; s.top = r.top + 'px'; s.width = r.width + 'px'; s.height = r.height + 'px';
    s.margin = '0'; s.transform = 'none'; s.boxSizing = 'border-box';

    if (g.querySelectorAll) [].forEach.call(g.querySelectorAll('[id]'), function (n) { n.removeAttribute('id'); });

    var g = null;
    if (el && !reduced()) { try { g = ghostOf(el); } catch (e) { g = null; } }
    if (g) {

      // Иначе – най-отгоре (родител с transform би изместил position:fixed).
      if (el.parentNode === document.body) el.parentNode.insertBefore(g, el.nextSibling);

<script>
/* AlmaSide – смяна на страната (ляво ↔ дясно) срещу запичане на екрана (Радио Alma Mater).
   Общ за телевизора (cast-receiver/index.html) и скрийнсейвъра. Иска #float и #main и AlmaFade (alma-fade.js);
   CSS-ът е в alma-side.css. Без нова песен 15 мин – също сменя страната. */
/* Смяна на страната: при нова песен целият блок избледнява и се появява огледално от другата страна.
   Без нова песен 15 мин (дълго предаване/дълга песен) – също. При „намалено движение“ – веднага, без избледняване. */
window.SSide = (function () {
  var lastKey = null, lastAt = Date.now(), busy = false;
  // Скрийнсейвърът може да я изключи (SS.side); на телевизора е винаги включена.
  function on() { return window.SS ? SS.side !== false : true; }
  function reduced() { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }
  function flip(apply) {
    var fl = document.getElementById('float'), m = document.getElementById('main');
    lastAt = Date.now();

    if (reduced()) { m.classList.toggle('flip'); if (apply) apply(); return; }

    setTimeout(function () {

      if (apply) apply();

    }, 850);
  }
  var hadSong = false; // при старт първата обложка е винаги отляво – смяната на страната започва от втората песен
  function art(img, song, apply, ms) {
    var key = song ? ((song.artist || '') + '|' + (song.title || '')).toLowerCase() : '';
    var changed = lastKey !== null && key !== lastKey;
    lastKey = key;
    if (changed && hadSong && on()) flip(apply);
    else AlmaFade.swap(img, apply, ms);

  return { art: art, flip: flip };
})();
</script>

<script>
/* AlmaWall – стена от обложки (Радио Alma Mater). Общ за скрийнсейвъра и (по-късно) телевизора.

     (появяват се една по една, на 2,5 сек);
   – нова песен: обложката ѝ се обръща на свободно място (или на най-старата плочка) и свети по-ярко 4 мин;
   – против запичане: на 3 мин две плочки си разменят местата; на 10 мин цялата стена бавно се отмества.
   СИГУРНОСТ: приемат се само адреси на картинки от Apple (mzstatic.com) и нашите (almaone.github.io/cast/covers/),
   проверени с регулярен израз; показват се само в <img> (никакъв HTML/CSS от външни данни); отговорът от сайта

  var OURS = /^https:\/\/almaone\.github\.io\/cast\/covers\/[A-Za-z0-9._-]{1,120}\.(?:jpe?g|png)$/i;
  var NOW = 'https://radioalmamater.bg/wp-json/alma/v1/now';

    if (OURS.test(u)) return u;

  var list = [], cells = [], wall = null, size = 0, cols = 0, rows = 0, queue = [], started = false, enabled = true;
  function load() {

  function build() {

    rows = H < W ? 6 : 9; size = Math.ceil(H / rows); cols = Math.ceil(W / size) + 1; rows += 1;

      req.media.streamType = M.StreamType.LIVE;
      var md = new M.MusicTrackMediaMetadata();
      md.title = STATION; md.artist = FREQ;
      req.media.metadata = md;
      return req;
    }
    context.addEventListener(cast.framework.system.EventType.READY, function () { selfLoad(); });
    // ---- ВРЕМЕННА ДИАГНОСТИКА: след колко секунди става всяка стъпка (първата минута, долу вляво) ----
    // Диагностиката е изключена (беше за проверка на бавния старт на Cast). За да се включи пак: true на двете места.
    var diagT0 = performance.now(), diagLog = [], diagOn = false; window.__diagOn = false;
    function diag(name) {
      if (!diagOn) return;
      var t = ((performance.now() - diagT0) / 1000).toFixed(1);
      if (diagLog.length && diagLog[diagLog.length - 1].slice(-name.length) === name) return;
      diagLog.push(t + ' ' + name);
      $('status').textContent = '⏱ ' + diagLog.slice(-9).join(' · ');
    }
    diag('v36');
    context.addEventListener(cast.framework.system.EventType.READY, function () { diag('готов'); });
    try { (function () {
      var a = $('player');
      [['loadstart', 'връзка'], ['loadedmetadata', 'формат'], ['progress', 'данни'], ['waiting', 'чака'],
       ['stalled', 'засечка'], ['canplay', 'готово'], ['playing', 'свири'], ['error', 'грешка']].forEach(function (p) {
        a.addEventListener(p[0], function () { diag(p[1]); });
      });
      pm.addEventListener(E.BUFFERING, function (e) { diag(e.isBuffering ? 'буфер+' : 'буфер−'); });
      pm.addEventListener(E.PLAYER_LOAD_COMPLETE, function () { diag('зареден'); });
    })(); } catch (e) {} // диагностиката никога не бива да пречи на звука
    // Таймер за заспиване от телефона: последните 30 секунди звукът затихва, после радиото спира.
    // Работи тук, на телевизора – дори телефонът да е заключен.
    var NS = 'urn:x-cast:bg.radioalmamater.app';
    var SLEEP_FADE_MS = 30000;
    var sleepUntil = null, sleepTick = null;
    // Затихване. Звукът на самия плейър Chromecast често не го слуша, затова намаляваме
    // и звука на устройството – и после го връщаме точно както е бил.
    var origVol = null;
    function fadeTo(k) {
      try { $('player').volume = k; } catch (e) {}
      try {
        if (origVol == null) {
          var v = context.getSystemVolume();
          origVol = v && typeof v.level === 'number' ? v.level : null;
        }
        if (origVol != null) context.setSystemVolumeLevel(Math.max(0.01, origVol * k));
      } catch (e) {}
    }
    function restoreVol() {
      try { $('player').volume = 1; } catch (e) {}
      if (origVol != null) {
        try { context.setSystemVolumeLevel(origVol); } catch (e) {}
        origVol = null;
      }
    }
    var sleepCloseT = null; // затварянето на екрана 5 сек след таймера (отменя се при ново „Пусни“)
    function clearSleep(keepVolume) {
      clearInterval(sleepTick); sleepTick = null; sleepUntil = null;
      if (!keepVolume) restoreVol();
    }
    function checkSleep() {
      if (!sleepUntil) return;
      var left = sleepUntil - Date.now();
      if (left <= 0) {
        clearSleep(true); // звукът остава тих, докато радиото спре
        clearTimeout(timer); tries = 3; // да не се пуска пак само
        try { pm.stop(); } catch (e) {}
        // Връщаме звука на устройството чак след като радиото е спряло (без „гръмване“).
        setTimeout(restoreVol, 1500);
        setPlaying(false);
        releaseAwake();
        status('Таймерът за заспиване спря радиото');
        // След 5 секунди затваряме нашия екран – Google TV се връща в обичайния си режим
        // и сам пуска скрийнсейвъра / заспива. Телефонът също разбира, че връзката е приключила.
        clearTimeout(sleepCloseT);
        sleepCloseT = setTimeout(function () { sleepCloseT = null; restoreVol(); try { context.stop(); } catch (e) {} }, 5000);
        return;
      }
      if (left < SLEEP_FADE_MS) {
        fadeTo(Math.max(0.05, left / SLEEP_FADE_MS));
        // Последните 30 секунди – отброяване долу вляво.
        status('Таймер за заспиване: радиото спира след ' + Math.ceil(left / 1000) + ' сек');
      }
    }
    // Екранът се затваря (напр. телефонът прекъсна връзката) – звукът на устройството да не остане тих.
    context.addEventListener(cast.framework.system.EventType.SHUTDOWN, function () { restoreVol(); });
    context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, function () { if (!sleepUntil) restoreVol(); });
    context.addCustomMessageListener(NS, function (e) {
      var d = e && e.data;
      if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { d = null; } }
      if (!d || d.type !== 'sleep') return;
      // „Изключи“ точно в края на таймера (часовниците на телефона и телевизора се разминават) – пренебрегваме:
      // таймерът и без това свършва, нека затихването и спирането да се довършат.
      if (typeof d.leftMs !== 'number' && sleepUntil && sleepUntil - Date.now() < 3000) return;
      if (sleepUntil && sleepUntil - Date.now() < SLEEP_FADE_MS) status(''); // таймерът е спрян/сменен по време на отброяването
      clearSleep();
      if (typeof d.leftMs === 'number') {
        sleepUntil = Date.now() + Math.max(0, d.leftMs);
        sleepTick = setInterval(checkSleep, 1000);
        checkSleep();
      }
    });
    // Нов старт от телефона след таймера – пълен звук и нормален надпис.
    pm.addEventListener(E.PLAYING, function () { tries = 0; if (!sleepUntil) { try { $('player').volume = 1; } catch (e) {} } });

    var options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = false;
    // Тръгваме, щом има 1 сек натрупан звук (по подразбиране Chromecast чака ~8 сек при поток на живо).
    try {
      var pc = new cast.framework.PlaybackConfig();
      pc.autoResumeDuration = 1;
      pc.autoResumeNumberOfSegments = 1;
      options.playbackConfig = pc;
    } catch (e) {}
    options.customNamespaces = {};
    options.customNamespaces[NS] = cast.framework.system.MessageType.JSON;
    context.start(options);
  } else {
    // Отворено в обикновен браузър – показваме екрана за преглед (без звук).
    setPlaying(true);
  }
  show(null, null, false); // начален фон – размитото лого
  try { AlmaWall.start(); } catch (e) {} // v35: стената от обложки
  try { AlmaRoam.start(); } catch (e) {} // v36: без песен – без логото
  // Песента и обложката – чак когато звукът тръгне: заявката за песента е към същия сървър
  // като звука и го задържаше (звукът тръгваше точно 8 сек след като я прекъснехме).
  // Резервно – след 30 сек, ако по някаква причина не свири.
  if (window.cast && cast.framework) {
    cast.framework.CastReceiverContext.getInstance().getPlayerManager()
      .addEventListener(cast.framework.events.EventType.PLAYING, function () { startPolling(); });
    setTimeout(startPolling, 30000);
  } else {
    startPolling();
  }
})();
</script>
